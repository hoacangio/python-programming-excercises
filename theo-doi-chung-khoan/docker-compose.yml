# Bản này chỉ dùng SQLite (mặc định trong .env.example: DATABASE_URL=sqlite:///data/portfolio.db).
# File SQLite nằm trong ./data được mount vào /app/data nên dữ liệu tồn tại ngoài container.
services:
  app:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      # Đảm bảo dùng SQLite ngay cả khi .env chưa khai báo DATABASE_URL.
      DATABASE_URL: ${DATABASE_URL:-sqlite:///data/portfolio.db}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # Xem docs/requirements.md mục "Lưu ý kỹ thuật": alert_bot.py chạy độc lập,
  # không import Streamlit. Bản đầu tiên dùng cron gọi mỗi 5 phút.
  alert_bot:
    build: .
    command: ["python", "alert_bot.py"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///data/portfolio.db}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
