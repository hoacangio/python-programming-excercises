
services:
  sqlite-web:
    image: coleifer/sqlite-web
    container_name: sqlite-web
    volumes:
      - ./data:/data   # mount your local folder with portfolio.db
    ports:
      - "8080:8080"    # access via http://localhost:8080
    command: sqlite_web -H 0.0.0.0 -p 8080 /data/portfolio.db
    restart: unless-stopped

  # Streamlit Application
  app:
    build: .
    container_name: theo-doi-chung-khoan-app
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      # Note: .env file is optional; defaults are used if not present
      # Use SQLite database from db service
      DATABASE_URL: ${DATABASE_URL:-sqlite:///data/portfolio.db}
      # Streamlit config
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
    volumes:
      - ./data:/app/data
      - ./:/app
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8501/_stcore/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Background Alert Bot Worker
  # Runs independently to check price alerts and send notifications
  # See docs/requirements.md "Lưu ý kỹ thuật": alert_bot.py is pure Python (no Streamlit)
  alert_bot:
    build: .
    container_name: theo-doi-chung-khoan-alert-bot
    command: ["python", "alert_bot.py"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///data/portfolio.db}
      # Add any additional alert bot config here
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
